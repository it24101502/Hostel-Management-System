name: Backend CI

on:
  push:
    branches:
      - main
      - "feature/**"

  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Restore dependencies
        run: dotnet restore backend/HostelManagement.sln

      - name: Build backend
        run: dotnet build backend/HostelManagement.sln --configuration Release --no-restore

      - name: Run unit tests
        run: dotnet test backend/HostelManagement.sln --configuration Release --no-build