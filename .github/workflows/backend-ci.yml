name: Backend CI

on:
  workflow_dispatch:

  push:
    branches:
      - main
      - "feature/**"
      - "integration/**"
      - "release/**"
      - "Sprint-*-QA-Testing"
      - deploy

  pull_request:
    branches:
      - main
      - "Sprint-*-QA-Testing"
      - deploy

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Set up .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"
      - name: Restore dependencies
        run: dotnet restore backend/HostelManagement.sln
      - name: Build backend
        run: dotnet build backend/HostelManagement.sln --configuration Release --no-restore

  test:
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - uses: actions/checkout@v5
      - name: Set up .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"
      - name: Run tests
        run: dotnet test backend/HostelManagement.sln --configuration Release

  migrate:
    runs-on: ubuntu-24.04
    needs: test
    environment: staging

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}
          MYSQL_ROOT_HOST: "%"
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -p$MYSQL_ROOT_PASSWORD"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}
      Jwt__Key: ${{ secrets.JWT_KEY }}
      ConnectionStrings__DefaultConnection: >-
        Server=127.0.0.1;
        Port=3306;
        Database=Hostel_Management_System;
        User ID=root;
        Password=${{ secrets.MYSQL_ROOT_PASSWORD }};
      Jwt__Issuer: HostelManagement.IdentityService
      Jwt__Audience: HostelManagement.Client
      Jwt__ExpiryMinutes: 15

    steps:
      - uses: actions/checkout@v5

      - name: Install MySQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y mysql-client

      - name: Run identity service migrations
        run: |
          for migration in $(ls -1 database/migrations/*.sql | sort -V); do
            echo "Running $migration"
            mysql --host=127.0.0.1 --port=3306 --user=root --password="$MYSQL_ROOT_PASSWORD" < "$migration"
          done

      - name: Run accommodation service migrations
        run: |
          for migration in $(ls -1 database/accommodation/migrations/*.sql | sort -V); do
            echo "Running $migration"
            mysql --host=127.0.0.1 --port=3306 --user=root --password="$MYSQL_ROOT_PASSWORD" < "$migration"
          done

      - name: Run leave service migrations
        run: |
          for migration in $(ls -1 database/leave/migrations/*.sql | sort -V); do
            echo "Running $migration"
            mysql --host=127.0.0.1 --port=3306 --user=root --password="$MYSQL_ROOT_PASSWORD" < "$migration"
          done

      - name: Run complaint service migrations
        run: |
          for migration in $(ls -1 database/complaint/migrations/*.sql | sort -V); do
            echo "Running $migration"
            mysql --host=127.0.0.1 --port=3306 --user=root --password="$MYSQL_ROOT_PASSWORD" < "$migration"
          done

      # Notice service migrations.
      - name: Run notice service migrations
        run: |
          for migration in database/notice/migrations/*.sql; do
            echo "Running $migration"
            mysql --host=127.0.0.1 --port=3306 --user=root --password="$MYSQL_ROOT_PASSWORD" < "$migration"
          done

      - name: Verify expected identity database tables
        run: |
          TABLE_COUNT=$(mysql \
            --host=127.0.0.1 \
            --port=3306 \
            --user=root \
            --password="$MYSQL_ROOT_PASSWORD" \
            --batch \
            --skip-column-names \
            --execute="
              SELECT COUNT(*)
              FROM information_schema.tables
              WHERE LOWER(table_schema) = LOWER('Hostel_Management_System')
                AND table_name IN (
                  'roles',
                  'users',
                  'user_sessions',
                  'login_audit_logs',
                  'student_profiles',
                  'guardian_contacts',
                  'fee_invoices',
                  'fee_payments',
                  'fee_reminder_notifications',
                  'hostel_blocks'
                );
            ")

          echo "Expected 10 identity tables; found $TABLE_COUNT."

          if [ "$TABLE_COUNT" -ne 10 ]; then
            echo "Database tables currently available:"
            mysql \
              --host=127.0.0.1 \
              --port=3306 \
              --user=root \
              --password="$MYSQL_ROOT_PASSWORD" \
              --execute="
                SELECT table_schema, table_name
                FROM information_schema.tables
                WHERE LOWER(table_schema) = LOWER('Hostel_Management_System')
                ORDER BY table_name;
              "
            exit 1
          fi

      - name: Verify expected accommodation database tables
        run: |
          TABLE_COUNT=$(mysql \
            --host=127.0.0.1 \
            --port=3306 \
            --user=root \
            --password="$MYSQL_ROOT_PASSWORD" \
            --batch \
            --skip-column-names \
            --execute="
              SELECT COUNT(*)
              FROM information_schema.tables
              WHERE LOWER(table_schema) = LOWER('Hostel_Accommodation_System')
                AND table_name IN (
                  'hostel_blocks',
                  'hostel_rooms',
                  'student_room_allocations',
                  'room_audit_logs',
                  'student_room_allocation_audit_logs'
                );
            ")

          echo "Expected 5 accommodation tables; found $TABLE_COUNT."

          if [ "$TABLE_COUNT" -ne 5 ]; then
            echo "Accommodation database tables currently available:"
            mysql \
              --host=127.0.0.1 \
              --port=3306 \
              --user=root \
              --password="$MYSQL_ROOT_PASSWORD" \
              --execute="
                SELECT table_schema, table_name
                FROM information_schema.tables
                WHERE LOWER(table_schema) = LOWER('Hostel_Accommodation_System')
                ORDER BY table_name;
              "
            exit 1
          fi

      - name: Verify expected leave database tables
        run: |
          TABLE_COUNT=$(mysql \
            --host=127.0.0.1 \
            --port=3306 \
            --user=root \
            --password="$MYSQL_ROOT_PASSWORD" \
            --batch \
            --skip-column-names \
            --execute="
              SELECT COUNT(*)
              FROM information_schema.tables
              WHERE LOWER(table_schema) = LOWER('Hostel_Leave_System')
                AND table_name IN (
                  'leave_requests',
                  'leave_request_audit_logs',
                  'leave_notifications'
                );
            ")

          echo "Expected 3 leave tables; found $TABLE_COUNT."

          if [ "$TABLE_COUNT" -ne 3 ]; then
            echo "Leave database tables currently available:"
            mysql \
              --host=127.0.0.1 \
              --port=3306 \
              --user=root \
              --password="$MYSQL_ROOT_PASSWORD" \
              --execute="
                SELECT table_schema, table_name
                FROM information_schema.tables
                WHERE LOWER(table_schema) = LOWER('Hostel_Leave_System')
                ORDER BY table_name;
              "
            exit 1
          fi

      - name: Verify leave request schema
        run: |
          LEAVE_CONSTRAINT_RESULT=$(mysql \
            --host=127.0.0.1 \
            --port=3306 \
            --user=root \
            --password="$MYSQL_ROOT_PASSWORD" \
            --batch \
            --skip-column-names \
            --execute="
              SELECT CONCAT(
                SUM(constraint_name = 'chk_leave_requests_dates'), ',',
                SUM(constraint_name = 'chk_leave_requests_status'), ',',
                SUM(constraint_name = 'chk_leave_requests_required_text')
              )
              FROM information_schema.table_constraints
              WHERE LOWER(table_schema) = LOWER('Hostel_Leave_System')
                AND table_name = 'leave_requests';
            ")

          echo "Required leave constraints: $LEAVE_CONSTRAINT_RESULT"
          test "$LEAVE_CONSTRAINT_RESULT" = "1,1,1"

          LEAVE_STATUS_DEFAULT=$(mysql \
            --host=127.0.0.1 \
            --port=3306 \
            --user=root \
            --password="$MYSQL_ROOT_PASSWORD" \
            --batch \
            --skip-column-names \
            --execute="
              SELECT TRIM(BOTH '\'' FROM column_default)
              FROM information_schema.columns
              WHERE LOWER(table_schema) = LOWER('Hostel_Leave_System')
                AND table_name = 'leave_requests'
                AND column_name = 'status';
            ")

          echo "Leave request status default: $LEAVE_STATUS_DEFAULT"
          test "$LEAVE_STATUS_DEFAULT" = "PENDING"

      - name: Verify leave decision and movement schema
        run: |
          LEAVE_COLUMN_RESULT=$(mysql \
            --host=127.0.0.1 \
            --port=3306 \
            --user=root \
            --password="$MYSQL_ROOT_PASSWORD" \
            --batch \
            --skip-column-names \
            --execute="
              SELECT COUNT(*)
              FROM information_schema.columns
              WHERE LOWER(table_schema) = LOWER('Hostel_Leave_System')
                AND table_name = 'leave_requests'
                AND column_name IN (
                  'decided_by_user_id',
                  'decision_reason',
                  'decided_at',
                  'departure_recorded_by_user_id',
                  'actual_departure_at',
                  'return_recorded_by_user_id',
                  'actual_return_at',
                  'overdue_alerted_at'
                );
            ")

          echo "Expected 8 decision/movement columns; found $LEAVE_COLUMN_RESULT."
          test "$LEAVE_COLUMN_RESULT" = "8"

          LEAVE_CHECK_RESULT=$(mysql \
            --host=127.0.0.1 \
            --port=3306 \
            --user=root \
            --password="$MYSQL_ROOT_PASSWORD" \
            --batch \
            --skip-column-names \
            --execute="
              SELECT CONCAT(
                SUM(constraint_name = 'chk_leave_requests_decision'), ',',
                SUM(constraint_name = 'chk_leave_requests_movement')
              )
              FROM information_schema.table_constraints
              WHERE LOWER(table_schema) = LOWER('Hostel_Leave_System')
                AND table_name = 'leave_requests';
            ")

          echo "Required leave status constraints: $LEAVE_CHECK_RESULT"
          test "$LEAVE_CHECK_RESULT" = "1,1"

      - name: Insert fee-report sample data (identity DB)
        run: |
          mysql \
            --host=127.0.0.1 \
            --port=3306 \
            --user=root \
            --password="$MYSQL_ROOT_PASSWORD" \
            --database=Hostel_Management_System \
            < database/tests/fee_status_report_sample_data.sql

      - name: Verify accommodation room schema
        run: |
          ROOM_COLUMN_RESULT=$(mysql \
            --host=127.0.0.1 \
            --port=3306 \
            --user=root \
            --password="$MYSQL_ROOT_PASSWORD" \
            --batch \
            --skip-column-names \
            --execute="
              SELECT CONCAT(
                SUM(column_name = 'block_id'), ',',
                SUM(column_name = 'floor_number'), ',',
                SUM(column_name = 'room_number'), ',',
                SUM(column_name = 'bed_capacity')
              )
              FROM information_schema.columns
              WHERE LOWER(table_schema) = LOWER('Hostel_Accommodation_System')
                AND table_name = 'hostel_rooms';
            ")

          echo "Required room columns: $ROOM_COLUMN_RESULT"
          test "$ROOM_COLUMN_RESULT" = "1,1,1,1"

          ROOM_CONSTRAINT_RESULT=$(mysql \
            --host=127.0.0.1 \
            --port=3306 \
            --user=root \
            --password="$MYSQL_ROOT_PASSWORD" \
            --batch \
            --skip-column-names \
            --execute="
              SELECT CONCAT(
                SUM(constraint_name = 'uq_hostel_rooms_location'), ',',
                SUM(constraint_name = 'fk_hostel_rooms_block'), ',',
                SUM(constraint_name = 'chk_hostel_rooms_bed_capacity')
              )
              FROM information_schema.table_constraints
              WHERE LOWER(table_schema) = LOWER('Hostel_Accommodation_System')
                AND table_name = 'hostel_rooms';
            ")

          echo "Required room constraints: $ROOM_CONSTRAINT_RESULT"
          test "$ROOM_CONSTRAINT_RESULT" = "1,1,1"

      - name: Verify fee report with sample data
        run: |
          REPORT_RESULT=$(mysql \
            --host=127.0.0.1 \
            --port=3306 \
            --user=root \
            --password="$MYSQL_ROOT_PASSWORD" \
            --batch \
            --skip-column-names \
            --execute="
              USE Hostel_Management_System;

              SELECT CONCAT(
                COUNT(*), ',',
                SUM(current_status = 'UNPAID'), ',',
                SUM(current_status = 'PAID'), ',',
                SUM(current_status = 'OVERDUE')
              )
              FROM
              (
                SELECT
                  CASE
                    WHEN fi.status = 'CANCELLED'
                      THEN 'CANCELLED'
                    WHEN fi.paid_amount >= fi.total_amount
                      THEN 'PAID'
                    WHEN fi.due_date < UTC_DATE()
                      THEN 'OVERDUE'
                    ELSE 'UNPAID'
                  END AS current_status
                FROM fee_invoices AS fi
                INNER JOIN student_profiles AS sp
                  ON sp.student_profile_id = fi.student_profile_id
                INNER JOIN hostel_blocks AS hb
                  ON hb.block_id = sp.hostel_block_id
                WHERE hb.block_code = 'CI-A'
              ) AS report_rows;
            ")

          echo "Report result: $REPORT_RESULT"
          echo "Expected: 3,1,1,1"

          test "$REPORT_RESULT" = "3,1,1,1"

      - name: Verify fee invoice status configuration
        run: |
          STATUS_DEFAULT=$(mysql \
            --host=127.0.0.1 \
            --port=3306 \
            --user=root \
            --password="$MYSQL_ROOT_PASSWORD" \
            --batch \
            --skip-column-names \
            --execute="
              SELECT TRIM(BOTH '\'' FROM column_default)
              FROM information_schema.columns
              WHERE LOWER(table_schema) = LOWER('Hostel_Management_System')
                AND table_name = 'fee_invoices'
                AND column_name = 'status';
            ")

          echo "Invoice status default: $STATUS_DEFAULT"
          test "$STATUS_DEFAULT" = "UNPAID"

      - name: Verify fee reminder configuration
        run: |
          REMINDER_DEFAULT=$(mysql \
            --host=127.0.0.1 \
            --port=3306 \
            --user=root \
            --password="$MYSQL_ROOT_PASSWORD" \
            --batch \
            --skip-column-names \
            --execute="
              SELECT TRIM(BOTH '\'' FROM column_default)
              FROM information_schema.columns
              WHERE LOWER(table_schema) = LOWER('Hostel_Management_System')
                AND table_name = 'fee_reminder_notifications'
                AND column_name = 'notification_status';
            ")

          echo "Reminder status default: $REMINDER_DEFAULT"
          test "$REMINDER_DEFAULT" = "PENDING"

      - name: Verify expected complaint database tables
        run: |
          TABLE_COUNT=$(mysql \
            --host=127.0.0.1 \
            --port=3306 \
            --user=root \
            --password="$MYSQL_ROOT_PASSWORD" \
            --batch \
            --skip-column-names \
            --execute="
              SELECT COUNT(*)
              FROM information_schema.tables
              WHERE LOWER(table_schema) = LOWER('Hostel_Complaint_System')
                AND table_name IN (
                  'complaints',
                  'complaint_audit_logs',
                  'complaint_notifications'
                );
            ")

          echo "Expected 3 complaint tables; found $TABLE_COUNT."

          if [ "$TABLE_COUNT" -ne 3 ]; then
            echo "Complaint database tables currently available:"
            mysql \
              --host=127.0.0.1 \
              --port=3306 \
              --user=root \
              --password="$MYSQL_ROOT_PASSWORD" \
              --execute="
                SELECT table_schema, table_name
                FROM information_schema.tables
                WHERE LOWER(table_schema) = LOWER('Hostel_Complaint_System')
                ORDER BY table_name;
              "
            exit 1
          fi

      - name: Verify complaint status and category schema
        run: |
          COMPLAINT_CONSTRAINT_RESULT=$(mysql \
            --host=127.0.0.1 \
            --port=3306 \
            --user=root \
            --password="$MYSQL_ROOT_PASSWORD" \
            --batch \
            --skip-column-names \
            --execute="
              SELECT CONCAT(
                SUM(constraint_name = 'chk_complaints_status'), ',',
                SUM(constraint_name = 'chk_complaints_category')
              )
              FROM information_schema.table_constraints
              WHERE LOWER(table_schema) = LOWER('Hostel_Complaint_System')
                AND table_name = 'complaints';
            ")

          echo "Required complaint constraints: $COMPLAINT_CONSTRAINT_RESULT"
          test "$COMPLAINT_CONSTRAINT_RESULT" = "1,1"

          COMPLAINT_STATUS_DEFAULT=$(mysql \
            --host=127.0.0.1 \
            --port=3306 \
            --user=root \
            --password="$MYSQL_ROOT_PASSWORD" \
            --batch \
            --skip-column-names \
            --execute="
              SELECT TRIM(BOTH '\'' FROM column_default)
              FROM information_schema.columns
              WHERE LOWER(table_schema) = LOWER('Hostel_Complaint_System')
                AND table_name = 'complaints'
                AND column_name = 'status';
            ")

          echo "Complaint status default: $COMPLAINT_STATUS_DEFAULT"
          test "$COMPLAINT_STATUS_DEFAULT" = "OPEN"

      - name: Verify expected notice database tables
        run: |
          TABLE_COUNT=$(mysql \
            --host=127.0.0.1 \
            --port=3306 \
            --user=root \
            --password="$MYSQL_ROOT_PASSWORD" \
            --batch \
            --skip-column-names \
            --execute="
              SELECT COUNT(*)
              FROM information_schema.tables
              WHERE LOWER(table_schema) = LOWER('Hostel_Notice_System')
                AND table_name IN ('notices', 'notice_audit_logs');
            ")

          echo "Expected 2 notice tables; found $TABLE_COUNT."
          test "$TABLE_COUNT" -eq 2

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Run NoticeService repository tests against MySQL
        env:
          NOTICE_TEST_CONNECTION: Server=127.0.0.1;Port=3306;Database=Hostel_Notice_System;User ID=root;Password=${{ secrets.MYSQL_ROOT_PASSWORD }};
        run: >
          dotnet test tests/NoticeService.Tests/NoticeService.Tests.csproj
          --configuration Release --filter "Category=MySql"

      - name: Verify notice archive and student filtering with sample data
        run: |
          MYSQL="mysql --host=127.0.0.1 --port=3306 --user=root --password=$MYSQL_ROOT_PASSWORD --batch --skip-column-names"
          $MYSQL < database/tests/notice_sample_data.sql
          # Same statements the repository runs when archiving.
          $MYSQL --database=Hostel_Notice_System --execute="
            START TRANSACTION;
            INSERT INTO notice_audit_logs
                (notice_id, actor_user_id, actor_role, action, title)
            SELECT notice_id, NULL, 'SYSTEM', 'ARCHIVE', title
            FROM notices
            WHERE is_archived = FALSE
              AND expiry_date < UTC_DATE()
              AND title LIKE 'CI %';
            UPDATE notices
            SET is_archived = TRUE, archived_at = UTC_TIMESTAMP(6)
            WHERE is_archived = FALSE
              AND expiry_date < UTC_DATE()
              AND title LIKE 'CI %';
            COMMIT;
          "
          ARCHIVED=$($MYSQL --database=Hostel_Notice_System --execute="
            SELECT COUNT(*) FROM notices
            WHERE title LIKE 'CI %' AND is_archived = TRUE;")
          AUDITED=$($MYSQL --database=Hostel_Notice_System --execute="
            SELECT COUNT(*) FROM notice_audit_logs
            WHERE action = 'ARCHIVE' AND actor_role = 'SYSTEM'
              AND actor_user_id IS NULL AND title LIKE 'CI %';")
          # Same filter as GetStudentNoticesAsync, for block 7.
          BLOCK7=$($MYSQL --database=Hostel_Notice_System --execute="
            SELECT COUNT(*) FROM notices
            WHERE title LIKE 'CI %'
              AND is_archived = FALSE
              AND expiry_date >= UTC_DATE()
              AND (hostel_block_id = 7 OR hostel_block_id IS NULL);")
          echo "Archived=$ARCHIVED Audited=$AUDITED Block7Visible=$BLOCK7"
          test "$ARCHIVED" = "1"
          test "$AUDITED" = "1"
          test "$BLOCK7" = "2"
          # The old role value must be rejected by the CHECK constraint.
          if $MYSQL --database=Hostel_Notice_System --execute="
            INSERT INTO notice_audit_logs
                (notice_id, actor_user_id, actor_role, action, title)
            VALUES (1, 0, 'SYSTEM_JOB', 'ARCHIVE', 'must fail');" 2>/dev/null; then
            echo "SYSTEM_JOB was accepted, but the constraint should reject it."
            exit 1
          fi

  package:
    runs-on: ubuntu-24.04
    needs: [migrate, ui-e2e]
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --ignore-scripts

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Validate Docker Compose configuration
        env:
          MYSQL_ROOT_PASSWORD: ci-validation-only-password
          JWT_KEY: ci-validation-only-signing-key-at-least-32-characters
        run: docker compose config --quiet

      - name: Build backend Docker image
        run: >
          docker build
          --file backend/IdentityService/Dockerfile
          --tag hostel-identity-service:ci
          .

      - name: Build frontend Docker image
        run: >
          docker build
          --file frontend/Dockerfile
          --tag hostel-frontend:ci
          .

      - name: Build leave service Docker image
        run: >
          docker build
          --file backend/LeaveService/Dockerfile
          --tag hostel-leave-service:ci
          .

      - name: Build accommodation service Docker image
        run: >
          docker build
          --file backend/AccommodationService/Dockerfile
          --tag hostel-accommodation-service:ci
          .

      - name: Build complaint service Docker image
        run: >
          docker build
          --file backend/ComplaintService/Dockerfile
          --tag hostel-complaint-service:ci
          .

      - name: Build notice service Docker image
        run: >
          docker build
          --file backend/NoticeService/Dockerfile
          --tag hostel-notice-service:ci
          .

  deploy:
    runs-on: ubuntu-24.04
    needs: package
    if: github.ref == 'refs/heads/deploy' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Deploy to Azure VM
        uses: appleboy/ssh-action@55dabf81b49d4120609345970c91507e2d734799 # v1.0.0
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            cd ~/hms
            git fetch origin
            git checkout deploy
            git reset --hard origin/deploy
            docker compose up -d --build

  deploy-frontend:
    runs-on: ubuntu-24.04
    needs: package
    if: github.ref == 'refs/heads/deploy' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend with HTTPS API URLs
        working-directory: frontend
        env:
          VITE_API_BASE_URL: https://${{ vars.API_DOMAIN }}/identity
          VITE_ACCOMMODATION_API_BASE_URL: https://${{ vars.API_DOMAIN }}/accommodation
          VITE_LEAVE_API_BASE_URL: https://${{ vars.API_DOMAIN }}/leave
          VITE_COMPLAINT_API_BASE_URL: https://${{ vars.API_DOMAIN }}/complaint
          VITE_NOTICE_API_BASE_URL: https://${{ vars.API_DOMAIN }}/notice
        run: |
          npm ci --ignore-scripts
          npm run build

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@1a947af9992250f3bc2e68ad0754c0b0c11566c9 # v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: frontend/dist
          skip_app_build: true

  ui-e2e:
    name: Selenium UI E2E
    runs-on: ubuntu-24.04
    needs: build
    timeout-minutes: 25

    env:
      # Disposable CI environment values only.
      MYSQL_ROOT_PASSWORD: hms-ci-e2e-password
      JWT_KEY: hms-ci-e2e-signing-key-for-disposable-tests-only
      E2E_USERNAME: E2EWarden
      E2E_PASSWORD: E2E-Warden-2026!
      E2E_HEADLESS: "1"
      E2E_BROWSER: chrome
      E2E_STUDENT_USERNAME: E2EStudent
      E2E_STUDENT_PASSWORD: E2E-Student-2026!
      E2E_MYSQL_CONTAINER: hostel-mysql

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install test dependencies
        run: |
          python -m pip install -r tests/ui_e2e/requirements.txt
          python -m pip install bcrypt==4.3.0

      - name: Build and start test services
        run: |
          docker compose up -d --build mysql identity-api accommodation-api notice-api

      - name: Wait for MySQL initialization
        shell: bash
        run: |
          ready=0
          for attempt in {1..90}; do
            status=$(docker inspect --format '{{.State.Health.Status}}' hostel-mysql)
            if [ "$status" = "healthy" ]; then
              ready=1
              break
            fi
            sleep 2
          done
          test "$ready" = "1"
          docker exec -e MYSQL_PWD="$MYSQL_ROOT_PASSWORD" hostel-mysql \
            mysql -uroot -e "SHOW TABLES FROM Hostel_Notice_System;"

      - name: Create disposable Warden account
        shell: python
        run: |
          import bcrypt
          import os
          import subprocess

          password_hash = bcrypt.hashpw(
              os.environ["E2E_PASSWORD"].encode(),
              bcrypt.gensalt(rounds=10),
          ).decode()

          sql = f"""
          USE Hostel_Management_System;
          INSERT INTO users (
              role_id, username, normalized_username,
              email, normalized_email, password_hash,
              first_name, last_name, is_email_verified
          )
          SELECT role_id, 'E2EWarden', 'E2EWARDEN',
              'e2e-warden@example.test', 'E2E-WARDEN@EXAMPLE.TEST',
              '{password_hash}', 'E2E', 'Warden', TRUE
          FROM roles WHERE role_name = 'WARDEN';
          """

          subprocess.run(
              [
                  "docker", "exec", "-i",
                  "-e", "MYSQL_PWD=" + os.environ["MYSQL_ROOT_PASSWORD"],
                  "hostel-mysql", "mysql", "-uroot",
              ],
              input=sql,
              text=True,
              check=True,
          )
          
      - name: Create student and block fixtures
        shell: python
        run: |
          import bcrypt
          import os
          import subprocess

          password_hash = bcrypt.hashpw(
              os.environ["E2E_STUDENT_PASSWORD"].encode(),
              bcrypt.gensalt(rounds=10),
          ).decode()

          sql = f"""
          USE Hostel_Accommodation_System;
          INSERT INTO hostel_blocks
              (block_id, block_code, block_name)
          VALUES
              (7, 'E2E-B7', 'E2E Student Block'),
              (8, 'E2E-B8', 'E2E Other Block');

          USE Hostel_Management_System;
          INSERT INTO hostel_blocks
              (block_id, block_code, block_name)
          VALUES
              (7, 'E2E-B7', 'E2E Student Block'),
              (8, 'E2E-B8', 'E2E Other Block');

          INSERT INTO users (
              role_id, username, normalized_username,
              email, normalized_email, password_hash,
              first_name, last_name, is_email_verified
          )
          SELECT role_id, 'E2EStudent', 'E2ESTUDENT',
              'e2e-student@example.test', 'E2E-STUDENT@EXAMPLE.TEST',
              '{password_hash}', 'E2E', 'Student', TRUE
          FROM roles WHERE role_name = 'STUDENT';

          INSERT INTO student_profiles (
              user_id, registration_number,
              normalized_registration_number, hostel_block_id
          )
          SELECT user_id, 'E2E-STUDENT-001', 'E2E-STUDENT-001', 7
          FROM users WHERE username = 'E2EStudent';
          """

          subprocess.run(
              [
                  "docker", "exec", "-i", "hostel-mysql",
                  "sh", "-c",
                  'MYSQL_PWD="$MYSQL_ROOT_PASSWORD" mysql -uroot',
              ],
              input=sql,
              text=True,
              check=True,
          )

      - name: Start local frontend
        working-directory: frontend
        env:
          VITE_API_BASE_URL: http://localhost:8080
          VITE_ACCOMMODATION_API_BASE_URL: http://localhost:8081
          VITE_NOTICE_API_BASE_URL: http://localhost:8084
        run: |
          npm ci
          nohup npm run dev -- --host 0.0.0.0 --port 5173 --strictPort > ../frontend-e2e.log 2>&1 &

      - name: Wait for frontend and APIs
        shell: python
        run: |
          import time
          import urllib.error
          import urllib.request

          targets = [
              ("http://localhost:5173", {200}),
              ("http://localhost:8080/api/auth/login", {405}),
              ("http://localhost:8081/api/admin/blocks", {401}),
              ("http://localhost:8084/api/notices", {401}),
          ]

          for url, expected in targets:
              for attempt in range(60):
                  try:
                      with urllib.request.urlopen(url, timeout=3) as response:
                          status = response.status
                  except urllib.error.HTTPError as error:
                      status = error.code
                  except (urllib.error.URLError, TimeoutError, OSError):
                      status = None

                  if status in expected:
                      print("Ready:", url)
                      break
                  time.sleep(2)
              else:
                  raise RuntimeError(f"Service not ready: {url}")

      - name: Run Selenium tests
        run: python tests/ui_e2e/run_tests.py

      - name: Collect service logs
        if: always()
        run: |
          mkdir -p tests/ui_e2e/artifacts
          docker compose logs --no-color > tests/ui_e2e/artifacts/services.log 2>&1
          if [ -f frontend-e2e.log ]; then
            cp frontend-e2e.log tests/ui_e2e/artifacts/
          fi
          if [ -f notice-validation.png ]; then
            cp notice-validation.png tests/ui_e2e/artifacts/
          fi

      - name: Upload E2E evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selenium-ui-e2e-evidence
          path: tests/ui_e2e/artifacts/
          retention-days: 7

      - name: Stop disposable services
        if: always()
        run: docker compose down -v