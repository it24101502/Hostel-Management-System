name: Code Quality

on:
  workflow_call:
  workflow_dispatch:

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_ORG: "it24101502"
      SONAR_PROJECT: "it24101502_Hostel-Management-System"
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install tools
        run: |
          dotnet tool install --global dotnet-sonarscanner
          dotnet tool install --global dotnet-reportgenerator-globaltool

      - name: Sonar begin
        if: env.SONAR_TOKEN != ''
        run: >
          dotnet sonarscanner begin
          /k:"$SONAR_PROJECT" /o:"$SONAR_ORG"
          /d:sonar.token="$SONAR_TOKEN"
          /d:sonar.host.url="https://sonarcloud.io"
          /d:sonar.cs.opencover.reportsPaths="**/coverage.opencover.xml"
          /d:sonar.exclusions="**/bin/**,**/obj/**,frontend/node_modules/**,**/wwwroot/**"
          /d:sonar.coverage.exclusions="**/Program.cs,**/Repositories/**,**/Events/Kafka*.cs,**/BackgroundServices/**"

      - name: Build
        run: dotnet build backend/HostelManagement.sln -c Release

      - name: Test with coverage
        run: >
          dotnet test backend/HostelManagement.sln -c Release --no-build
          --settings testing/quality/coverlet.runsettings
          --results-directory TestResults

      - name: Sonar end
        if: env.SONAR_TOKEN != ''
        run: dotnet sonarscanner end /d:sonar.token="$SONAR_TOKEN"

      - name: Coverage report
        if: always()
        run: >
          reportgenerator
          -reports:"TestResults/**/coverage.opencover.xml"
          -targetdir:coverage-report
          -reporttypes:"Html;MarkdownSummaryGithub;JsonSummary"

      - name: Add coverage to the run summary
        if: always()
        run: cat coverage-report/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: coverage-report
          path: coverage-report