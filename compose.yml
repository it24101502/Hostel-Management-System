services:
  mysql:
    image: mysql:8.4
    container_name: hostel-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "3307:3306"
    volumes:
      - hostel-mysql-data:/var/lib/mysql
      - ./database/migrations/001_create_auth_schema.sql:/docker-entrypoint-initdb.d/001_create_auth_schema.sql:ro
      - ./database/migrations/002_create_auth_audit_logs.sql:/docker-entrypoint-initdb.d/002_create_auth_audit_logs.sql:ro
      - ./database/migrations/003_create_student_profile_and_fee_schema.sql:/docker-entrypoint-initdb.d/003_create_student_profile_and_fee_schema.sql:ro
      - ./database/migrations/004_update_fee_invoice_status_values.sql:/docker-entrypoint-initdb.d/004_update_fee_invoice_status_values.sql:ro
      - ./database/migrations/005_create_fee_reminder_notifications.sql:/docker-entrypoint-initdb.d/005_create_fee_reminder_notifications.sql:ro
      - ./database/migrations/006_add_hostel_blocks.sql:/docker-entrypoint-initdb.d/006_add_hostel_blocks.sql:ro
      - ./database/accommodation/migrations/001_create_accommodation_database.sql:/docker-entrypoint-initdb.d/101_create_accommodation_database.sql:ro
      - ./database/accommodation/migrations/002_create_rooms.sql:/docker-entrypoint-initdb.d/102_create_accommodation_rooms.sql:ro
      - ./database/accommodation/migrations/003_create_student_room_allocations.sql:/docker-entrypoint-initdb.d/103_create_accommodation_allocations.sql:ro
      - ./database/accommodation/migrations/004_create_room_audit_logs.sql:/docker-entrypoint-initdb.d/104_create_accommodation_audit_logs.sql:ro
      - ./database/accommodation/migrations/005_create_allocation_audit_logs.sql:/docker-entrypoint-initdb.d/105_create_allocation_audit_logs.sql:ro
      - ./database/accommodation/migrations/006_support_allocation_release.sql:/docker-entrypoint-initdb.d/106_support_allocation_release.sql:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  kafka:
    image: apache/kafka:4.1.0
    container_name: hostel-kafka
    hostname: kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_LISTENERS: "PLAINTEXT://:19092,CONTROLLER://:29093,PLAINTEXT_HOST://:9092"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:19092,PLAINTEXT_HOST://localhost:9092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:29093"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_NUM_PARTITIONS: "1"
    volumes:
      - hostel-kafka-data:/var/lib/kafka/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"
        ]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 30s

  kafka-init:
    image: apache/kafka:4.1.0
    container_name: hostel-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    command:
      - /bin/sh
      - -c
      - >
        /opt/kafka/bin/kafka-topics.sh
        --bootstrap-server kafka:19092
        --create
        --if-not-exists
        --topic student-deactivated
        --partitions 1
        --replication-factor 1

  identity-api:
    build:
      context: .
      dockerfile: backend/IdentityService/Dockerfile
    image: hostel-identity-service:sprint1
    container_name: hostel-identity-api
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      Jwt__Key: ${JWT_KEY}
      ConnectionStrings__DefaultConnection: "Server=mysql;Port=3306;Database=Hostel_Management_System;User ID=root;Password=${MYSQL_ROOT_PASSWORD};"
      OverdueFeeJob__Enabled: "true"
      Kafka__BootstrapServers: "kafka:19092"
      Kafka__StudentDeactivatedTopic: "student-deactivated"
    ports:
      - "8080:8080"
    volumes:
      - hostel-profile-photos:/app/wwwroot/uploads/profile-photos
    depends_on:
      mysql:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully

  accommodation-api:
    build:
      context: .
      dockerfile: backend/AccommodationService/Dockerfile
    image: hostel-accommodation-service:sprint2
    container_name: hostel-accommodation-api
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      Jwt__Key: ${JWT_KEY}
      ConnectionStrings__DefaultConnection: "Server=mysql;Port=3306;Database=Hostel_Accommodation_System;User ID=root;Password=${MYSQL_ROOT_PASSWORD};"
      Kafka__BootstrapServers: "kafka:19092"
      Kafka__StudentDeactivatedTopic: "student-deactivated"
      Kafka__ConsumerGroupId: "accommodation-service"
    ports:
      - "8081:8080"
    depends_on:
      mysql:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:8080
        VITE_ACCOMMODATION_API_BASE_URL: http://localhost:8081
    image: hostel-frontend:sprint1
    container_name: hostel-frontend-web
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - identity-api
      - accommodation-api

volumes:
  hostel-mysql-data:
  hostel-profile-photos:
  hostel-kafka-data:
